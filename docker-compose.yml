version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: antipattern-postgres
    environment:
      POSTGRES_DB: antipattern_db
      POSTGRES_USER: antipattern_user
      POSTGRES_PASSWORD: antipattern_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - antipattern-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antipattern_user -d antipattern_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: antipattern-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - antipattern-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: antipattern-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - antipattern-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sonarqube:
    build: ./services/sonarqube
    container_name: antipattern-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: antipattern_user
      SONAR_JDBC_PASSWORD: antipattern_pass
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9002:9000"
    networks:
      - antipattern-network
    depends_on:
      postgres:
        condition: service_healthy

  roslyn:
    build: ./services/roslyn
    platform: linux/amd64
    container_name: antipattern-roslyn
    volumes:
      - ./test-projects:/workspace
    networks:
      - antipattern-network
    command: tail -f /dev/null

  archunit:
    build: ./services/archunit
    container_name: antipattern-archunit
    volumes:
      - ./test-projects:/workspace
    networks:
      - antipattern-network
    command: tail -f /dev/null

  api:
    build: ./services/api
    container_name: antipattern-api
    environment:
      DATABASE_URL: postgresql://antipattern_user:antipattern_pass@postgres:5432/antipattern_db
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_TOKEN: squ_admin_token
    volumes:
      - ./test-projects:/workspace
      - ./services/api/app:/app
    ports:
      - "8000:8000"
    networks:
      - antipattern-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  dashboard:
    build: ./services/dashboard
    container_name: antipattern-dashboard
    ports:
      - "3000:80"
    networks:
      - antipattern-network
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  redis_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  antipattern-network:
    driver: bridge
